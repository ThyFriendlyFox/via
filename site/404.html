<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Via: page not found</title>
    <meta name="robots" content="noindex">
    <base href="%ORIGIN%/">
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="site.css">
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1b1917" media="(prefers-color-scheme: dark)">
    <script>
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch {}
        const dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        if (stored) for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.content = dark ? "#1b1917" : "#fbfaf7";
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="./" aria-label="Via, home">
          <!-- The Via wordmark (logo.svg). -->
          <svg class="logo" viewBox="283 202 394 136" fill="currentColor" stroke="currentColor" stroke-width="12" stroke-linejoin="round" aria-hidden="true"><path d="m378.4252 269.28348-44.566925-60.472458h-44.566925l89.13385 120.9449z"/><path d="M389.88452 208.81102h39.46457v33.10237h-39.46457z"/><path d="M464.09186 210.2441h39.46457v120.94487h-39.46457z"/><path d="m581.5748 269.28348 44.566895 60.472443h44.566956l-89.13385-120.9449z"/><path d="M570.1155 329.75592h-39.46454v-33.102386h39.46454z"/><path fill="none" d="M409.6168 241.91339v57.606293h-31.181091M503.55643 270.71652h46.834625v25.952759M570.1155 313.2047h18.233643v-13.669281h15.498657M429.3491 225.3622h17.37146v45.354324h17.368683"/></svg>
        </a>
      </div>
    </header>
    <main class="lost">
      <div class="wrap">
        <p class="eyebrow">404</p>
        <h1 class="title">Page not found</h1>
        <p class="lede">The page you are looking for does not exist. <a class="link" href="./">Return to the home page</a>.</p>
      </div>
    </main>
  </body>
</html>
