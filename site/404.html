<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Via: this page is not here</title>
    <meta name="robots" content="noindex">
    <base href="%ORIGIN%/">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="site.css">
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1b1917" media="(prefers-color-scheme: dark)">
    <script>
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch {}
        const dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        if (stored) for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.content = dark ? "#1b1917" : "#fbfaf7";
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="./" aria-label="Via, home">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9h18.5v14H30M11.5 9v14h9" stroke-width="3"/><path d="M2 16h5.5M24.5 16H30" stroke-width="3" stroke-opacity=".28"/></svg>
          <span>via</span>
        </a>
      </div>
    </header>
    <main class="lost">
      <div class="wrap">
        <p class="eyebrow">404</p>
        <h1 class="title">This page is not here.</h1>
        <p class="lede">The site is 1 page. <a class="link" href="./">Go to it</a>.</p>
      </div>
    </main>
  </body>
</html>
