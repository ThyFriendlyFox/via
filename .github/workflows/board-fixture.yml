# The reusable workflow board-gates.yml, called as a board repository calls it, on the fixture
# tests/boards/pass-rc-divider with --strict. Via is this run's own commit, so a pull request
# that changes board-gates.yml, or a file the job executes, runs its own text. GREEN is the only green
# check. The paths: the 2 workflows, the fixture, tools/ (workcenter, image.py, ci/apt_archive.sh and
# what they import), install.sh and the image's other 2 inputs, Dockerfile and requirements.txt.
name: Board gates fixture
on:
  pull_request:
    paths:
      - .github/workflows/board-gates.yml
      - .github/workflows/board-fixture.yml
      - tests/boards/pass-rc-divider/**
      - tools/**
      - install.sh
      - requirements.txt
      - Dockerfile
  push:
    branches: [main]
    paths:
      - .github/workflows/board-gates.yml
      - .github/workflows/board-fixture.yml
      - tests/boards/pass-rc-divider/**
      - tools/**
      - install.sh
      - requirements.txt
      - Dockerfile
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  fixture:
    uses: ./.github/workflows/board-gates.yml
    with:
      projects: '["tests/boards/pass-rc-divider"]'
      strict: true
      workcenter-repository: ${{ github.repository }}
      workcenter-ref: ${{ github.sha }}
