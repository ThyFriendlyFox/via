name: Image
# Via's container image: built from the Dockerfile, which runs install.sh, on both machines
# GitHub hosts for a public repository (amd64 and arm64), each checked by its own doctor and by the gates
# on a fixture run as the runner's user. A pull request builds and pushes nothing: it is install.sh's run
# on a clean machine. main, a release's tag, the weekly run and a run by hand push to ghcr.io under the
# owner's name in lower case, with the workflow's own token.
on:
  pull_request:
    # The files the build reads to make the toolchain, and the tools that name and check it.
    paths:
      - Dockerfile
      - .dockerignore
      - install.sh
      - requirements.txt
      - tools/image.py
      - tools/workcenter
      - .github/workflows/image.yml
  push:
    # Every push to main, with no path filter: the image holds Via at its commit, so `main`
    # is main's code once its build ends, whichever file the push changed.
    branches: [main]
    tags: ['v*.*.*']
  schedule:
    # Monday 04:17 UTC: KiCad's point releases and Ubuntu's fixes reach the image within a week.
    - cron: '17 4 * * 1'
  workflow_dispatch:
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: The image's name and its content tag
        id: tag
        run: python3 tools/image.py tag --owner "$GITHUB_REPOSITORY_OWNER" --github-output
      - name: Build (install.sh, then workcenter doctor; a doctor that does not pass fails the build)
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build --progress plain \
            --build-arg TOOLCHAIN_TAG="$TAG" --build-arg WORKCENTER_REVISION="$GITHUB_SHA" \
            --build-arg APT_UPDATE_TIMEOUT=120 --build-arg APT_DOWNLOAD_TIMEOUT=570 \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.description="Via: KiCad 10, ngspice, FreeRouting, openEMS" \
            -t "$IMAGE:$TAG-$ARCH" .
      - name: The tools' versions, read from the image
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker run --rm "$IMAGE:$TAG-$ARCH" python3 /opt/workcenters/ee/src/tools/image.py show | tee record.json
          {
            echo "### $IMAGE:$TAG-$ARCH"
            echo '```json'
            cat record.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The gates on a fixture, as the runner's user; every file they write is that user's
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          board=$(mktemp -d)/board
          cp -r tests/boards/pass-rc-divider "$board"
          docker run --rm --user "$(id -u):$(id -g)" -v "$board":/work "$IMAGE:$TAG-$ARCH" workcenter gates .
          # The gates' record: the file the build test of tests/test_image.py read the owner of.
          test -s "$board/build/gates.json"
          owners=$(find "$board/build" -printf '%u\n' | sort -u)
          echo "owners of the files written: $owners"
          # On its own line, so that bash -e stops the step when id -un fails: for a user id with no
          # name it prints the number, which find prints too, and ends with 1.
          me=$(id -un)
          test "$owners" = "$me"
      - name: Push this machine's image (never from a pull request)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$TAG-$ARCH"

  # Runs only when both machines' images built, passed their doctor and their gates, and were pushed.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: The image's name and its content tag
        id: tag
        run: python3 tools/image.py tag --owner "$GITHUB_REPOSITORY_OWNER" --github-output
      - name: 1 image for both machines, under its tags
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # The content tag moves with each rebuild of 1 toolchain definition (a KiCad point release);
          # the dated tag does not move; a digest never does.
          tags=(-t "$IMAGE:$TAG" -t "$IMAGE:$TAG-$(date -u +%Y%m%d)")
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(-t "$IMAGE:main"); fi
          case "$GITHUB_REF" in refs/tags/v*) tags+=(-t "$IMAGE:$GITHUB_REF_NAME") ;; esac
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG" | tee inspect.txt
          {
            echo "### $IMAGE:$TAG"
            echo
            echo "Tags: ${tags[*]}"
            echo
            echo '```'
            cat inspect.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
