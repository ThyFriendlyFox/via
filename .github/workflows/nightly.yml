name: Nightly
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # As in ci.yml's install path: the hosts of Ubuntu's archive, fastest first; a silent one given up.
      - name: Rank the hosts of Ubuntu's archive, fastest first; give up a silent one
        id: archive
        env:
          ENABLED: ${{ vars.CI_APT_UBUNTU_ARCHIVE }}
        run: |
          if [ "$ENABLED" = 0 ]; then
            echo "[apt-archive] off: the repository variable CI_APT_UBUNTU_ARCHIVE is 0; apt keeps the runner's mirror"
          else
            sudo env APT_ARCHIVE_CI=1 bash tools/ci/apt_archive.sh /etc/apt
          fi
      - name: Install Via's toolchain
        id: install
        run: sudo env REQUIRE_FREEROUTING=1 APT_UPDATE_TIMEOUT=120 APT_DOWNLOAD_TIMEOUT=570 ./install.sh
      - name: Verify
        id: verify
        # The gate's log is kept for the issue's step: its `why:` lines go into the issue.
        run: |
          mkdir -p build
          set -o pipefail
          make verify 2>&1 | tee build/nightly-verify.log
      # The ci-failure issue follows the nights: tools/ci/nightly_issue.py decides, this step carries it out.
      - name: Open, speak to or close the ci-failure issue
        if: success() || failure()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          ARCHIVE: ${{ steps.archive.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const open = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, labels: 'ci-failure', state: 'open' });
            fs.mkdirSync('build', { recursive: true });
            fs.writeFileSync('build/nightly-issues.json', JSON.stringify(open));
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const env = process.env;
            const out = execFileSync('python3', ['tools/ci/nightly_issue.py',
              '--outcome', env.JOB_STATUS, '--log', 'build/nightly-verify.log',
              '--issues', 'build/nightly-issues.json', '--run', run,
              '--date', new Date().toISOString().slice(0, 10),
              '--step', `archive=${env.ARCHIVE}`, '--step', `install=${env.INSTALL}`,
              '--step', `verify=${env.VERIFY}`], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] });
            for (const act of JSON.parse(out).actions) {
              if (act.do === 'open') {
                await github.rest.issues.create({ ...context.repo, title: act.title, labels: act.labels, body: act.body });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number: act.issue, body: act.body });
                if (act.do === 'close') {
                  await github.rest.issues.update({ ...context.repo, issue_number: act.issue,
                    state: 'closed', state_reason: act.reason });
                }
              }
            }
