name: Nightly
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # As in ci.yml's install path: Ubuntu's own archive, not the runner's regional mirror.
      - name: Ask Ubuntu's own archive, not the runner's regional mirror
        env:
          ENABLED: ${{ vars.CI_APT_UBUNTU_ARCHIVE }}
        run: |
          if [ "$ENABLED" = 0 ]; then
            echo "[apt-archive] off: the repository variable CI_APT_UBUNTU_ARCHIVE is 0; apt keeps the runner's mirror"
          else
            sudo env APT_ARCHIVE_CI=1 bash tools/ci/apt_archive.sh /etc/apt
          fi
      - name: Install the workcenter toolchain
        run: sudo env REQUIRE_FREEROUTING=1 APT_UPDATE_TIMEOUT=120 APT_DOWNLOAD_TIMEOUT=570 ./install.sh
      - name: Verify
        run: make verify
      - name: File issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({ ...context.repo, labels: 'ci-failure', state: 'open' });
            if (open.data.length === 0) {
              await github.rest.issues.create({ ...context.repo,
                title: `Nightly verify failed — ${new Date().toISOString().slice(0,10)}`,
                labels: ['ci-failure'],
                body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            }
